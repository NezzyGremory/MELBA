[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "melba"
version = "0.2.0"
description = "A NumPy-based business data regression library"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MELBA contributors" }]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/NezzyGremory/MELBA"

[tool.setuptools.packages.find]
include = ["melba*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
