[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "melba"
version = "0.1.0"
description = "A NumPy-based business data regression library"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "MELBA contributors" }]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["melba*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
